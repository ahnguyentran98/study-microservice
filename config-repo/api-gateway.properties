# API Gateway Configuration
spring.application.name=api-gateway
server.port=8080

# Gateway Routes Configuration
# User Service Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=user-service,forward:/fallback

# Product Service Routes
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=product-service,forward:/fallback

# Order Service Routes
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=order-service,forward:/fallback

# Payment Service Routes
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[3].filters[0]=CircuitBreaker=payment-service,forward:/fallback

# Notification Service Routes
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[4].filters[0]=CircuitBreaker=notification-service,forward:/fallback

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Discovery Configuration (for Eureka integration)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Circuit Breaker Default Configuration
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

# Apply default config to all circuit breakers
resilience4j.circuitbreaker.instances.user-service.baseConfig=default
resilience4j.circuitbreaker.instances.product-service.baseConfig=default
resilience4j.circuitbreaker.instances.order-service.baseConfig=default
resilience4j.circuitbreaker.instances.payment-service.baseConfig=default
resilience4j.circuitbreaker.instances.notification-service.baseConfig=default

# Retry Configuration
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=500ms
resilience4j.retry.instances.user-service.baseConfig=default
resilience4j.retry.instances.product-service.baseConfig=default
resilience4j.retry.instances.order-service.baseConfig=default
resilience4j.retry.instances.payment-service.baseConfig=default
resilience4j.retry.instances.notification-service.baseConfig=default

# Time Limiter Configuration  
resilience4j.timelimiter.configs.default.timeoutDuration=3s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
resilience4j.timelimiter.instances.user-service.baseConfig=default
resilience4j.timelimiter.instances.product-service.baseConfig=default
resilience4j.timelimiter.instances.order-service.baseConfig=default
resilience4j.timelimiter.instances.payment-service.baseConfig=default
resilience4j.timelimiter.instances.notification-service.baseConfig=default

# Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
management.endpoint.gateway.enabled=true
management.health.circuitbreakers.enabled=true
management.endpoint.health.group.liveness.include=livenessState,diskSpace
management.endpoint.health.group.readiness.include=readinessState,circuitBreakers

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.com.microservices.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
