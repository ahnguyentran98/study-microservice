services:
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: config-server-app
    ports:
      - "8888:8888"
    volumes:
      - ../config-repo:/config-repo
    environment:
      - CONFIG_REPO_PATH=/config-repo
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  microservices-network:
    external: true
